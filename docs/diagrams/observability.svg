<text x="40" y="1094" dy="0.35em" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#000" text-anchor="start">Plain boxes are execution contexts; gray boxes are shared state or queues; dashed boxes are external consumers and outputs.</text>
<text x="40" y="1128" dy="0.35em" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#000" text-anchor="start">Mio, Ringline, and proxy threads use the same process registry and logging subscriber. Metric families choose their own synchronization.</text>
<text x="40" y="1162" dy="0.35em" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#000" text-anchor="start">Counters are read individually: an export is not an atomic snapshot of all threads. Histogram refresh and counter-group export are current gaps.</text>
<text x="40" y="1196" dy="0.35em" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#000" text-anchor="start">The tracing-appender label is the dependency's default thread name; optional klog output creates another worker with that name.</text>
